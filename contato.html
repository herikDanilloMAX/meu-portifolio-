<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de contato do meu portfólio">
    <title>Contato | Meu Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu Portfólio de Tecnologia</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section id="contato">
            <h2>Entre em contato</h2>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome:</label><br>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required
                        >
                    </p>

                    <p>
                        <label for="email">E-mail:</label><br>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </p>

                    <p>
                        <label for="nascimento">
                            Data de nascimento:
                        </label><br>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                        >
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label><br>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                        >
                    </p>

                </fieldset>

                <fieldset>

                    <legend>Informações profissionais</legend>

                    <p>
                        <label for="github">GitHub:</label><br>

                        <input
                            type="url"
                            id="github"
                            name="github"
                            placeholder="https://github.com/seuusuario"
                        >
                    </p>

                    <p>Área de interesse:</p>

                    <p>
                        <input
                            type="radio"
                            id="python"
                            name="interesse"
                            value="Python"
                        >

                        <label for="python">Python</label>
                    </p>

                    <p>
                        <input
                            type="radio"
                            id="cloud"
                            name="interesse"
                            value="Cloud/AWS"
                        >

                        <label for="cloud">Cloud/AWS</label>
                    </p>

                </fieldset>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Meu Portfólio de Tecnologia</p>
    </footer>

</body>
</html>
